# aarch64 is cross-compiled inside cross's container rather than against a hand-rolled sysroot.

[build.env]
passthrough = ["KAMPR_REQUIRE_BUNDLE"]

# `vendored-tls` builds OpenSSL from source, which needs perl and make in the image.
[target.x86_64-unknown-linux-musl]
pre-build = ["apt-get update && apt-get install --assume-yes perl make"]

[target.aarch64-unknown-linux-musl]
pre-build = ["apt-get update && apt-get install --assume-yes perl make"]
