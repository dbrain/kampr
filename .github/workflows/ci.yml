name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # The node's integration suite is the only thing that exercises the real Herdr seam, and it
      # skips itself when `herdr` is missing — which on a bare runner is always. Green CI without
      # this step proves almost nothing about the node.
      - name: install herdr
        run: |
          set -eu
          curl -fsSL https://herdr.dev/latest.json -o latest.json
          url=$(jq -er '.assets["linux-x86_64"]' latest.json)
          want=$(jq -er '.sha256["linux-x86_64"]' latest.json)
          curl -fsSL "$url" -o herdr
          echo "$want  herdr" | sha256sum -c -
          chmod +x herdr
          mkdir -p "$HOME/.local/bin"
          mv herdr "$HOME/.local/bin/herdr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: herdr --version
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test — a skipped integration suite is a failure, not a pass
        run: |
          set -euo pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee test.log
          if grep -q "skipping: no herdr on PATH" test.log; then
            echo "::error::the node integration suite skipped itself — herdr was installed but unreachable"
            exit 1
          fi

  # The release builds two Apple targets and every other job here builds Linux, so a Linux-only
  # libc constant compiled clean, passed CI, was tagged, and then failed both Apple jobs of the
  # release workflow with the tag already pushed — `SOCK_NONBLOCK`/`SOCK_CLOEXEC`, which the BSDs
  # do not have on `socket(2)`. This cannot be a cross-check from the Linux job: `openssl-sys`,
  # `ring` and `aws-lc-sys` compile C, so an Apple target needs an Apple toolchain. `check` rather
  # than `build` because what escapes this way is a name that does not exist on the platform, and
  # that is a typecheck away rather than a link away.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The QR is decoded by an independent decoder rather than asserted against the bitmap that
      # produced it. Without zbar the test skips, and KAMPR_QR_DECODE makes that skip a failure.
      - run: sudo apt-get install -y zbar-tools
      - name: install herdr
        run: |
          set -eu
          curl -fsSL https://herdr.dev/latest.json -o latest.json
          url=$(jq -er '.assets["linux-x86_64"]' latest.json)
          want=$(jq -er '.sha256["linux-x86_64"]' latest.json)
          curl -fsSL "$url" -o herdr
          echo "$want  herdr" | sha256sum -c -
          chmod +x herdr
          mkdir -p "$HOME/.local/bin"
          mv herdr "$HOME/.local/bin/herdr"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Not `build`: that packages the *release* variant, and `checkReleaseSigning` correctly
      # refuses to produce an unsigned APK on a runner with no keystore. The key stays on the
      # operator's machine, so CI verifies everything except the one step that needs it.
      #
      # A test task's cache key is its classpath, not the machine that ran it, so a result stored
      # by one runner is restored onto another with different fonts, a different locale and no
      # display and reported as a pass with nothing executed. Four `:terminal:jvmTest` tests
      # failed on every runner for weeks behind `FROM-CACHE`. The init script makes test tasks
      # run; the greps are here because an init script that silently stopped applying would put
      # the hole straight back, and only compilation stays cached.
      - name: check — a test restored from the build cache is not a test that ran
        working-directory: client
        env:
          KAMPR_QR_DECODE: '1'
        run: |
          set -euo pipefail
          env -u GRADLE_HOME ./gradlew -I gradle/tests-must-run.init.gradle.kts \
            check :webApp:stageNodeBundle :androidApp:assembleDebug 2>&1 | tee check.log
          # A closed set of test-*execution* task names, not a `Test` suffix: `compileAndroidHostTest`,
          # `javaPreCompileDebugUnitTest` and `lintAnalyzeDebugAndroidTest` all end in `Test`, are
          # compilation and lint rather than execution, and are honestly cacheable.
          if grep -E '^> Task :[^ ]*:(jvmTest|wasmJsTest|wasmJsBrowserTest|testAndroidHostTest|test) FROM-CACHE$' check.log; then
            echo "::error::a test task was served from the build cache — this job proved nothing"
            exit 1
          fi
          for task in :shared:jvmTest :terminal:jvmTest :shared:testAndroidHostTest; do
            grep -qx "> Task $task" check.log || {
              echo "::error::$task did not run, so nothing it guards was checked"
              exit 1
            }
          done
      - name: the build staged a real bundle
        run: |
          test -s crates/kampr-node/dist/index.html
          ls crates/kampr-node/dist/*.wasm >/dev/null
      - run: cargo build -p kampr-cli
      # LiveNodeTest is the only real-client-against-real-node test in the repo and had never run
      # once — which is precisely why the client called four `/auth/*` paths no node has ever
      # routed. KAMPR_LIVE makes a skip a failure, the same rule the rust job already applies.
      - name: live client-against-node tests — a skip is a failure, not a pass
        env:
          KAMPR_LIVE: '1'
          KAMPR_CONFIG_DIR: ${{ runner.temp }}/kampr/config
          KAMPR_STATE_DIR: ${{ runner.temp }}/kampr/state
        run: |
          set -euo pipefail
          herdr server &
          for _ in $(seq 1 60); do [ -S "$HOME/.config/herdr/herdr.sock" ] && break; sleep 1; done
          ./target/debug/kampr init --bind 127.0.0.1:8794 --name ci
          ./target/debug/kampr serve &
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:8794/api/node >/dev/null && break; sleep 1; done
          code=$(./target/debug/kampr pair | tr -d '[:space:]')
          token=$(curl -fsS -X POST http://127.0.0.1:8794/auth/pair \
            -H 'content-type: application/json' \
            -d "{\"code\":\"$code\",\"device_name\":\"ci\"}" | jq -er .token)
          KAMPR_URL=http://127.0.0.1:8794 KAMPR_TOKEN="$token" \
            env -u GRADLE_HOME ./client/gradlew -p client \
              -I "$PWD/client/gradle/tests-must-run.init.gradle.kts" :shared:jvmTest \
              --tests 'dev.kampr.shared.LiveNodeTest.theClientReadsTheAuthSurfaceOfARealNode' \
              --tests 'dev.kampr.shared.LiveNodeTest.preferencesWrittenOnOneConnectionComeBackOnTheNext'
      - uses: actions/upload-artifact@v7
        with:
          name: client-bundle
          path: crates/kampr-node/dist
          include-hidden-files: true
          retention-days: 1

  # The release binary embeds the bundle, so the order Gradle-then-cargo is load-bearing. This job
  # runs it the way release.yml does, and proves the guard actually bites.
  single-binary:
    needs: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the guard rejects a dist that holds only the placeholder
        run: |
          set -eu
          if KAMPR_REQUIRE_BUNDLE=1 cargo build -p kampr-node > guard.log 2>&1; then
            echo "::error::kampr-node built with an empty dist/ — the bundle guard is not working"
            exit 1
          fi
          grep -q "no client bundle" guard.log
      - uses: actions/download-artifact@v8
        with:
          name: client-bundle
          path: crates/kampr-node/dist
      - name: the same build succeeds once the bundle is staged
        env:
          KAMPR_REQUIRE_BUNDLE: '1'
        run: cargo build -p kampr-cli

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shell syntax
        run: for f in packaging/*.sh; do sh -n "$f"; done
      - name: shellcheck
        run: shellcheck --shell=sh packaging/*.sh
      - name: install path
        run: sh packaging/selftest.sh
      - name: plugin dispatcher
        run: sh packaging/kamprctl-selftest.sh
      - name: plugin manifest parses and declares a version floor
        run: |
          python3 - <<'PY'
          import tomllib, pathlib
          m = tomllib.loads(pathlib.Path("herdr-plugin.toml").read_text())
          for key in ("id", "name", "version", "min_herdr_version"):
              assert m.get(key), f"herdr-plugin.toml is missing {key}"
          ids = [a["id"] for a in m.get("actions", [])]
          assert len(ids) == len(set(ids)), f"duplicate action ids: {ids}"
          for entry in m.get("build", []) + m.get("startup", []) + m.get("actions", []) + m.get("panes", []):
              cmd = entry["command"]
              assert isinstance(cmd, list) and cmd, "commands must be argv arrays"
              if cmd[0] in ("sh", "bash"):
                  script = pathlib.Path(cmd[1])
                  assert script.is_file(), f"manifest points at a missing script: {script}"
          assert set(m["platforms"]) == {"linux", "macos"}, "install.sh supports linux and macos only"
          print(f"ok: {m['id']} {m['version']}, floor {m['min_herdr_version']}, {len(ids)} actions")
          PY
