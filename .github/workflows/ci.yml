name: ci

# Every step that checks something is a `make` target, so `make check` on a workstation runs what
# this file runs. The toolchain is `rust-toolchain.toml`'s, installed by rustup on first use.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # The live suites fail outright without herdr, and a bare runner never has one. No grep
      # for a skip message: the suite panics rather than skipping, and says which of the two
      # failures it is — absent, or present and not listening (#233).
      - run: scripts/install-herdr.sh
      - run: herdr --version
      - run: make check-rust

  # The release builds two Apple targets and every other job here builds Linux. This cannot be a
  # cross-check from the Linux job: `openssl-sys`, `ring` and `aws-lc-sys` compile C, so an Apple
  # target needs an Apple toolchain. `check` rather than `build` because what escapes this way is
  # a name that does not exist on the platform, which is a typecheck away rather than a link away.
  darwin:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make check-darwin

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y zbar-tools
      - run: scripts/install-herdr.sh
      - run: make check-client
      # LiveNodeTest is the only real-client-against-real-node test in the repo and had never run
      # once — which is precisely why the client called four `/auth/*` paths no node has ever
      # routed.
      - run: make ci-live-client
        env:
          KAMPR_CONFIG_DIR: ${{ runner.temp }}/kampr/config
          KAMPR_STATE_DIR: ${{ runner.temp }}/kampr/state
      - uses: actions/upload-artifact@v7
        with:
          name: client-bundle
          path: crates/kampr-node/dist
          include-hidden-files: true
          retention-days: 1

  # The release binary embeds the bundle, so the order Gradle-then-cargo is load-bearing. This job
  # runs it the way release.yml does, and proves the guard actually bites.
  single-binary:
    needs: client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make ci-bundle-guard
      - uses: actions/download-artifact@v8
        with:
          name: client-bundle
          path: crates/kampr-node/dist
      - name: the same build succeeds once the bundle is staged
        env:
          KAMPR_REQUIRE_BUNDLE: '1'
        run: cargo build -p kampr-cli

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make check-packaging
