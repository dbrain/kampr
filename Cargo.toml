[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/dbrain/kampr"

[workspace.dependencies]
anyhow = "1.0.104"
argon2 = { version = "0.5.3", default-features = false, features = ["alloc"] }
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws", "macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
ed25519-dalek = { version = "3.0.0", default-features = false }
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
mime_guess = "2.0.5"
openssl-sys = { version = "0.9.117", features = ["vendored"] }
qrcode = { version = "0.14.1", default-features = false }
rust-embed = "8.12.0"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "net", "io-util", "sync", "time", "signal", "fs"] }
tokio-stream = "0.1.19"
toml = "1.1.4"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["compression-br", "compression-gzip", "set-header", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ulid = "3.0.0"
url = "2.5.8"
web-push = { version = "0.11.0", default-features = false }
webauthn-rs = "0.5.5"
# The ES256 keypair generator. Held at 0.12 because web-push 0.11 requires `^0.12.11`, so 0.13
# cannot unify — it would put two jwt-simple trees (and two of p256, k256, rand) in the binary.
# Safe to hold: this crate only ever calls `ES256KeyPair::generate()`, never verifies a token, so
# the 0.13 `exp` validation fixes are not on any path Kampr takes.
jwt-simple = { version = "0.12.17", default-features = false, features = ["pure-rust"] }

# dev
# `ring` rather than the default aws-lc, so the tree carries one crypto backend and it is
# the one rustls is configured with.
rcgen = { version = "0.14.9", default-features = false, features = ["ring", "pem"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2", "charset"] }
tempfile = "3.27.0"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }

# Release artefacts are downloaded, not built, so size and start-up cost more than build time.
[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# argon2 in a debug build is ~50x slower than in release, which turns a pairing redemption in the
# test suite into seconds. Optimising just the KDF keeps the cost honest without that.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
